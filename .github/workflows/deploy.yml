name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual pipeline execution from GitHub Actions dashboard

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Set up transient credentials for the git execution environment
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Force synchronization downstream to the exact destination namespace
          git push --force https://pigscanfly1:$HF_TOKEN@huggingface.co/spaces/mozartjones/pigscanfly1-no-drift-api main